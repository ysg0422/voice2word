# Voice2Word 共享配置（由 `voice2word-cli --print-default-config` 生成）
#
# 这里只放**便携默认值**：路径全部相对程序目录，换台机器即可用。
# 机器专属的东西（绝对路径、GPU 策略、在线翻译接口与密钥）会由程序
# 自动写进同目录的 config.local.toml，不会混进本文件。
#
# 一般来说不需要手改本文件——界面里的「性能设置」改的就是这些项。

[paths]
ffmpeg = "tools/ffmpeg.exe"
whisper_cli = "tools/whisper-vulkan/whisper-1.8.4-windows-x64/whisper-cli.exe"
whisper_model = "models/whisper/ggml-small-q5_0.bin"
vad_model = "models/whisper/ggml-silero-v6.2.0.bin"
punc_model = "models/punc/model.int8.onnx"
vocal_model = "models/vocal_sep/UVR-MDX-NET-Inst_HQ_3.onnx"
sensevoice_model = "models/sensevoice/model.int8.onnx"
sensevoice_tokens = "models/sensevoice/tokens.txt"
sensevoice_vad = "models/sensevoice/silero_vad.onnx"
llama_cli = "tools/llama-completion.exe"
llm_model = "models/llm/qwen2.5-0.5b-instruct-q4_k_m.gguf"
python = "python"

[pipeline]
language = "zh"
output_format = "srt"
enable_polish = true
polish_mode = "punc"
enable_vad = true
whisper_threads = 16
whisper_processors = 1
whisper_no_fallback = true
whisper_rescue_logprob = 0.0
whisper_low_confidence = -0.35
whisper_max_context = 32
whisper_audio_speed = 1.0
whisper_vad_threshold = 0.5
preprocess_enabled = true
preprocess_denoise = true
preprocess_normalize = true
preprocess_highpass_hz = 70.0
preprocess_compact = false
preprocess_min_saving = 0.1
preprocess_vocal_sep = false
llm_threads = 8
llm_ctx = 4096
parallel_workers = 0
enable_diarization = false
speaker_count = 2
asr_hotwords = ""

[gpu]
hardware_init_completed = false
hardware_tier = "cpu"
hwaccel_decode = false
whisper_offload = false
onnx_provider = "cpu"
yield_to_desktop = true
gpu_limit_percent = 100

[subtitle_style]
font_size = 40
letter_spacing = 1
line_spacing = 1.2000000476837158
max_chars_per_line = 16
bottom_margin = 40
margin_lr = 20
preset_name = "白字黑影"
pos_x_percent = 50.0
primary_color = "#FFFFFF"
outline_width = 2.0
outline_color = "#000000"
bg_style = "shadow"
bg_opacity = 0.6000000238418579
is_bold = true
alignment = "center"
karaoke_word_highlight = true
custom_presets = []

[translate]
mode = "offline_qwen"
api_base = ""
api_key = ""
api_model = ""
batch_size = 20
timeout_secs = 120
target_lang = "简体中文"
glossary = ""
max_glossary_entries = 80

[ui]
theme = "dark"
export_mode = "bilingual"
export_format = "jianying"
export_name_template = "{name}.{ext}"

[dub]
mode = "mix"
bgm_volume = 0.25
max_rate_percent = 35
source = "translation"
voice_zh = ""
voice_en = ""

[watch]
enabled = false
dir = ""
recursive = false
interval_secs = 3
settle_secs = 5
