# =============================================================================
# Voice2Word — CI (GitHub Actions)
# =============================================================================
# 设计要点与取舍（逐条对应验收要求）：
#
# 1) 为什么只跑 windows-latest，而不是 ubuntu / macos / windows 三平台矩阵：
#    - 项目自身定位就是 Windows 桌面程序（GPUI + D3D12/WARP），
#      `.cargo/config.toml` 的 `[env] GPUI_FXC_PATH` 指向 Windows SDK 的
#      `fxc.exe`（gpui 0.2.2 的 build.rs 在 **release** 构建时装着色器需要它；
#      windows-latest 镜像自带 Windows SDK，靠 `where.exe fxc.exe` 能命中，
#      路径不存在时 gpui 会自动回退，所以该变量在 CI 上无需改动）。
#    - 运行/验收所依赖的外部资产全是 Windows 二进制：
#      whisper-cli.exe / ffmpeg.exe / 带 sherpa-onnx 的 Python。non-Windows
#      runner 上这些一律不存在。
#    - 关于 Linux 编译：`src/` 里的 Windows 专属 API（CommandExt::creation_flags、
#      AsRawHandle、Job Object 的 kernel32 extern 声明）**都已用
#      #[cfg(target_os = "windows")] / #[cfg(windows)] 包住**，且多数还配了
#      `#[cfg(not(windows))]` 的 `kill -9` 回退（见 sensevoice.rs:18-27、
#      whisper.rs:1079-1090、utils/child_registry.rs:41、media_pipeline.rs:367+）。
#      所以"Linux 上必然编译失败"这个说法我**没有实测依据，不下断言**。
#    - 但即便如此仍不铺 Linux runner，理由是收益/风险不成比例：
#      1. gpui 0.2.2 的 Linux 后端要拉 X11/Wayland/fontconfig 等系统库，
#         其依赖树里还有 bindgen（需要 libclang）、cbindgen —— 这些在
#         ubuntu-latest 上要额外装一堆 apt 包才可能编过，属于**未验证**路径；
#         真铺上去，大概率长期红着或者要反复调 apt 列表，是噪音不是信号。
#      2. 本项目没有任何 Linux 发布目标，绿灯也不代表任何真实用户场景。
#    - 结论：平台一致性 > 平台覆盖度。等真要做跨平台移植时，再单独开一条
#      Linux 分支试验 workflow（并且要先把系统依赖装齐、验证过再进主干）。
#
# 2) 为什么 test job 用 `--test-threads=1`（单线程）：
#    独立验收发现 `cargo test --lib` 在默认多线程下**偶发** `STATUS_HEAP_CORRUPTION`
#    （约 25 次跑崩 1 次；崩溃时缺失的正是两个 wgpu 相关用例：
#    media_pipeline::tests::wgpu_shader_converts_limited_black 与
#    media_pipeline::tests::detect_does_not_panic —— 二者都会
#    `wgpu::Instance::enumerate_adapters` / 创建软件适配器）。
#    这是已知缺陷的**规避**手段，不是修复。见文件末尾 TODO(#ci-wgpu-flake)。
#    同时保留 `test-lib-parallel-nonblocking` job（`continue-on-error: true`）
#    持续采集该崩溃的复现率，一旦长期为 0 就可以删掉单线程绕过。
#
# 3) 为什么 clippy 是 -D warnings：
#    当前基线 `cargo clippy --all-targets` 是 0 error / 约 34 warning。
#    按任务要求把 clippy 做成**硬门禁**。注意：这意味着在 warning 清零之前，
#    clippy job 一定会红。若需要"先红后绿"的过渡期，临时把
#    `-D warnings` 换成 `-D warnings -A clippy::all` 之类的白名单，
#    或把该 job 加 `continue-on-error: true`；warning 清零后请还原成严格门禁。
#
# 4) 第三方依赖的 future-incompat 通告不判红：
#    `proc-macro-error2 v2.0.1`（经依赖树传入）会打印 future-incompat 通告，
#    不是本仓库代码的问题，CI 里不做任何校验，忽略即可。
#
# 5) `VOICE2WORD_CI`：见文件末尾 CI_ENV_CONTRACT 说明。
# =============================================================================

name: CI

on:
  push:
    branches:
      - '**'          # 含 codex/** 等所有功能分支
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次仍在跑的 CI，省 runner 配额。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只读权限；各 job 需要写权限时单独声明。
permissions:
  contents: read

env:
  # 仓库范围内的 CI 标记。**当前仓库内没有任何代码读取它**（详见文件末尾
  # CI_ENV_CONTRACT 的核查结论），保留它只是为了给后续"CI 专用分支"留个约定名。
  VOICE2WORD_CI: "1"
  # 强制彩色输出，日志更干净、更好比对（否则 CI 上 cargo 自动关色）。
  CARGO_TERM_COLOR: always
  # 让 panic/ABORT 输出完整回溯——尤其是那个偶发 STATUS_HEAP_CORRUPTION，
  # 有回溯才有排查价值。
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — fmt：硬门禁，格式必须完全一致（只检查，绝不写文件）
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt (rustfmt --check)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --all -- --check
        # 注意：这里只做 --check，CI 永远不会执行 `cargo fmt` 去改源码。
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Job 1.5 — 版本号一致性：Cargo.toml 是权威来源，安装包脚本里的副本不得漂移
  # ---------------------------------------------------------------------------
  #
  # `installer/voice2word.iss` 用 `#define MyAppVersion "..."` 决定安装包文件名与
  # 卸载项版本，而它是手工维护的副本。Cargo.toml 升到 0.1.4 时它仍写着 0.1.3——
  # 结果「关于」里显示 0.1.4、下载到的安装程序却叫 `-v0.1.3-Setup.exe`，
  # Windows 的「添加/删除程序」里也会留下一个错版本号。这类漂移不会让任何测试变红，
  # 只能靠比对发现，所以在这里钉一道。
  version-sync:
    name: version sync (Cargo.toml vs installer)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare versions
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
               Select-Object -First 1
          if (-not $m) { throw "Cargo.toml 里找不到 version 字段" }
          $cargoVer = $m.Matches[0].Groups[1].Value
          $issM = Select-String -Path installer/voice2word.iss -Pattern '#define\s+MyAppVersion\s+"([^"]+)"' |
                  Select-Object -First 1
          if (-not $issM) { throw "voice2word.iss 里找不到 MyAppVersion" }
          $issVer = $issM.Matches[0].Groups[1].Value
          Write-Host "Cargo.toml = $cargoVer ; voice2word.iss = $issVer"
          if ($cargoVer -ne $issVer) {
            throw "版本号漂移：Cargo.toml=$cargoVer 但 installer/voice2word.iss=$issVer。" +
                  "请把 voice2word.iss 的 MyAppVersion 改成 $cargoVer。"
          }

  # ---------------------------------------------------------------------------
  # Job 1.6 — 打包完整性：安装包必须带上**同目录 DLL**
  # ---------------------------------------------------------------------------
  #
  # 这道门禁守的是「本机好使、别人电脑不好使」最典型的一种成因：
  #
  #   llama.cpp 的 llama-completion.exe 只有 ~9 KB（真正的代码在 llama-common.dll /
  #   llama-server-impl.dll / ggml-*.dll 里），whisper.cpp 的 whisper-cli.exe 同理。
  #   安装包若只发入口 exe 不发 DLL，客户机上这两个程序会立刻以 0xC0000139
  #   (STATUS_ENTRYPOINT_NOT_FOUND) 退出，**且没有任何 stderr**——用户只看到
  #   「点了没反应」，日志里也查不到任何线索。
  #
  # 开发机上 DLL 就在仓库的 tools/ 下（本机跑过），所以本地永远正常；
  # 打包时漏掉就必然复发。因此这里把它钉成硬门禁。
  packaging-integrity:
    name: packaging integrity (installer ships runtime DLLs)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer must ship the runtime DLLs
        shell: pwsh
        run: |
          $iss = Get-Content installer/voice2word.iss -Raw -Encoding UTF8
          $required = @(
            'llama*.dll',
            'ggml*.dll',
            'llama*.exe',
            'whisper-vulkan\whisper-1.8.4-windows-x64\*',
            # ffplay 的共享库依赖：静态构建时文件不存在（skipifsourcedoesntexist 跳过），
            # 但**规则必须声明**，否则换成 shared 构建时它们的 DLL 会被静默漏掉。
            'av*.dll',
            'sw*.dll',
            # VC++ 可再发行运行库：干净系统上缺了就是 0xC0000139。
            'vcruntime140.dll',
            'msvcp140.dll'
          )
          $missing = @()
          foreach ($pattern in $required) {
            if ($iss -notmatch [regex]::Escape($pattern)) {
              $missing += $pattern
            }
          }
          if ($missing.Count -gt 0) {
            throw ('安装包缺少运行时 DLL 规则：' + ($missing -join ', ') +
                   '。llama.cpp / whisper.cpp 的入口 exe 依赖同目录 DLL，缺了客户机上会' +
                   '静默以 0xC0000139 退出。请在 installer/voice2word.iss 的 [Files] 段补上。')
          }
          Write-Host '安装包已声明随包分发的运行时 DLL'

      - name: Main exe runtime must sit next to it
        shell: pwsh
        run: |
          # voice2word.exe 的 PE 导入表里**直接**写着 vcruntime140.dll（Rust 的 MSVC
          # 目标默认动态链接 CRT），而它不是 Windows 自带组件。只把它放进 tools\
          # 是给 whisper / llama 用的，主程序在没装 VC++ Redist 的机器上会 0xC0000135。
          $iss = Get-Content installer/voice2word.iss -Raw -Encoding UTF8
          $needle = 'Source: "..\tools\vcruntime140.dll"; DestDir: "{app}";'
          if (-not $iss.Contains($needle)) {
            throw '安装包没有把 vcruntime140.dll 放到 {app}（主程序同目录）：干净 Windows 上主程序会起不来。'
          }
          Write-Host '主程序运行库已放在 exe 同目录'

      - name: Packaging scripts must be usable from PowerShell 5.1
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 无 BOM 时按 ANSI 解码 .ps1，中文注释会破坏字符串
          # 字面量、直接语法错误跑不起来。仓库里多数脚本带 BOM，新加的不带就会
          # 「在我机器上能跑」（pwsh 7 默认 UTF-8）、在别人机器上报错。
          $bad = @()
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            $nonAscii = $text -match '[^\x00-\x7F]'
            if ($nonAscii -and -not $hasBom) { $bad += $f.Name }
          }
          if ($bad.Count -gt 0) {
            throw ('以下 .ps1 含中文但缺 UTF-8 BOM，PowerShell 5.1 下会语法错误：' + ($bad -join ', '))
          }
          Write-Host '所有含中文的 .ps1 都带 UTF-8 BOM'

      - name: Package self-check script exists
        shell: pwsh
        run: |
          if (-not (Test-Path scripts/verify_package.ps1)) {
            throw '缺 scripts/verify_package.ps1：打包产物没有自检环节。'
          }
          $v = Get-Content scripts/verify_package.ps1 -Raw -Encoding UTF8
          # 自检必须在**隔离 PATH** 下试跑，否则打包机上 ffmpeg 的 DLL 目录恰好在
          # PATH 里时，缺 DLL 的 ffplay 也能「通过」——自检变成自欺。
          if ($v -notmatch 'env:PATH') {
            throw 'verify_package.ps1 没有隔离 PATH：缺 DLL 的组件会被误判为可用。'
          }
          Write-Host '打包自检脚本存在且会隔离 PATH'
          $rel = Get-Content .github/workflows/release.yml -Raw -Encoding UTF8
          if ($rel -notmatch 'verify_package') {
            throw 'release.yml 没有调用 verify_package.ps1：自检没进发布流程。'
          }
          Write-Host 'release 流程已包含打包自检'

      - name: Prefetch script must not leave dev-machine artifacts
        shell: pwsh
        run: |
          $script = Get-Content scripts/prefetch_inference_backends.ps1 -Raw -Encoding UTF8
          # 预取前必须清空目标目录：开发机上的自编译 Vulkan/llama 版与 CI 下载的
          # 官方 CPU 版**文件名相同、内容不同**，不清就会「包内容取决于打包机的历史状态」。
          if ($script -notmatch 'Remove-Item[^\r\n]*Recurse') {
            throw 'prefetch_inference_backends.ps1 没有清空目标目录：包内容会取决于打包机的历史状态。'
          }
          Write-Host '预取脚本会先清空目标目录'

      - name: Release workflow must not swallow prefetch failures
        shell: pwsh
        run: |
          $rel = Get-Content .github/workflows/release.yml -Raw -Encoding UTF8
          # 预取失败 = 安装包缺 DLL = 客户机上必然失败。这种失败必须让发布失败，
          # 而不是 continue-on-error 悄悄出一个坏包。
          if ($rel -match 'Prefetch inference backends[\s\S]{0,200}continue-on-error') {
            throw 'release.yml 的预取步骤用了 continue-on-error：预取失败会发出一个必然失败的包。'
          }
          Write-Host '预取失败会阻断发布'
      - name: Release workflow must prefetch inference backends
        shell: pwsh
        run: |
          $rel = Get-Content .github/workflows/release.yml -Raw -Encoding UTF8
          if ($rel -notmatch 'prefetch_inference_backends') {
            throw ('release.yml 里没有预取推理后端的步骤：打包机不预取 llama.cpp / ' +
                   'whisper.cpp，安装包就会缺 DLL —— 正是「本机好使、别人电脑不好使」的成因。')
          }
          Write-Host 'release 流程已包含推理后端预取'

  # ---------------------------------------------------------------------------
  # Job 2 — clippy：硬门禁，warning 即 error
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy (-D warnings)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # target/ 极大（GPUI + wgpu + SQLite + ONNX 依赖树），不缓存 CI 会慢到不可用。
      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          # clippy / test / build 各 job 共用同一份缓存（rust-cache 仍会把
          # rustc 版本、Cargo.lock 哈希、目标三元组混进最终 key，所以不会串味）。
          shared-key: v2w-windows
          # 缓存 registry（~/.cargo）与 target/；本项目 target 目录很大，必须缓存，
          # 否则 GPUI + wgpu + bundled SQLite 这套依赖树每次冷编会把 CI 拖到不可用。
          cache-targets: "true"

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Job 3 — test：硬门禁（单线程，规避已知 wgpu 偶发堆损坏）
  # ---------------------------------------------------------------------------
  test:
    name: test (--lib, single-thread)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2w-windows

      - name: cargo test --lib -- --test-threads=1
        # --test-threads=1 是**规避**已知偶发 STATUS_HEAP_CORRUPTION 的绕过手段，
        # 不是修复：默认并行时约 25 次跑崩 1 次，崩掉的正是两个 wgpu 用例。
        # TODO(#ci-wgpu-flake): 多线程下的 STATUS_HEAP_CORRUPTION 待排查
        #   - 复现：cargo test --lib（默认并行，反复跑）
        #   - 现象：STATUS_HEAP_CORRUPTION，缺 media_pipeline 的两个 wgpu 用例
        #   - 怀疑方向：多个测试并发枚举 wgpu adapter / 创建软件适配器时
        #     共享的全局状态或第三方库（wgpu 0.20 / d3d12 / WARP）非线程安全
        #   - 关联观测 job：test-lib-parallel-nonblocking
        run: cargo test --lib -- --test-threads=1

  # ---------------------------------------------------------------------------
  # Job 3b — 非阻塞：默认多线程跑 lib 测试，专门采集上面那个偶发崩溃的复现率。
  #          永远不阻塞合并（continue-on-error: true），只为留证据。
  # ---------------------------------------------------------------------------
  test-lib-parallel-nonblocking:
    name: test (--lib, default parallel, non-blocking)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2w-windows

      - name: cargo test --lib (default parallel — flake telemetry)
        # 目的单一：暴露 STATUS_HEAP_CORRUPTION 的复现率。
        # 红不代表代码坏，只代表这次踩到了已知偶发问题；详见 TODO(#ci-wgpu-flake)。
        run: cargo test --lib

  # ---------------------------------------------------------------------------
  # Job 4 — 跨目标测试（可选，非阻塞）
  #          --all-targets 会把 examples/ 与 tests/ 全部编译并运行。
  #
  #          实测结论（已逐个读过 tests/*.rs）：**tests/ 下的集成测试会红**，
  #          因为它们对外部资产是硬断言而不是提前 return：
  #            - tests/test_pipeline.rs:26-39  assert! ffmpeg / whisper-cli /
  #              whisper 模型 / llama-cli / llm 模型 / sample.mp4 必须存在
  #            - tests/test_sensevoice.rs:18-21  assert! runner / onnx / tokens /
  #              vad 必须存在；:83 再 assert! sample.mp4
  #            - tests/test_real_video.rs:122  assert! 测试视频必须存在
  #            - tests/test_benchmark_sensevoice_32min.rs:38  assert! 视频存在
  #          而 models/ 与 resources/ 都在 .gitignore 里（CI 检出后为空目录），
  #          所以这个 job 在 CI 上**必然失败**——这正是它 continue-on-error 的原因。
  #          它的价值只剩两点：1) 证明 tests/ 与 examples/ 能编译过；
  #          2) 在装了外部依赖的自托管 runner 上给出真实信号。
  #
  #          真正"依赖缺失就提前 return"的是 **lib 内的单元测试**（--lib），
  #          例如 src/engines/chunked_whisper.rs:688/740/819 读不到
  #          cfg["paths"]["ffmpeg"] 就直接 return；所以 Job 3 是稳定的。
  # ---------------------------------------------------------------------------
  test-all-targets-nonblocking:
    name: test (--all-targets, non-blocking)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2w-windows

      - name: cargo test --all-targets --no-fail-fast
        run: cargo test --all-targets --no-fail-fast

  # ---------------------------------------------------------------------------
  # Job 5 — build：可选、非阻塞。产出 release 可执行文件并上传。
  #          只 `needs: [fmt]`（秒级、稳定），**不依赖** clippy/test——
  #          这样存量 clippy warning 不会连带掐掉构建产物与 smoke 信号；
  #          build 自身 `continue-on-error: true`，红了也不挡合并。
  # ---------------------------------------------------------------------------
  build:
    name: build (release, non-blocking)
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    needs: [fmt]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2w-windows
          # release 产物与 debug 不同，单独一份缓存 key 后缀。
          key: release

      - name: cargo build --release
        run: cargo build --release --bin voice2word

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: voice2word-windows-release
          # 只收主程序，避免把整个 target/ 传上去。
          # 注意 release profile 设了 `strip = "symbols"`，因此 PDB 可能不存在，
          # 这里不把 .pdb 列为必选，缺失只告警不失败。
          path: |
            target/release/voice2word.exe
          if-no-files-found: warn
          retention-days: 14

