# =============================================================================
# Voice2Word — Release (打 tag 自动构建并发布)
# =============================================================================
# 用法：本地打一个 semver tag 并推送即可，例如
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# 触发后本工作流会：
#   1. 在 windows-latest 上构建 release（产物为绿色便携版 exe）
#   2. 跑一次 lib 单测做最低限度的发布前验证
#   3. 创建 GitHub Release 并直接发布 voice2word.exe（tag 带 - 的视为预发布）
#
# 关于权限：创建 Release 需要 contents: write（本文件显式声明）。
# 若推送 tag 时被拒并提示 workflow scope，说明所用 PAT 缺少 workflow 权限。
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

# 同一 tag 重复推送时取消在跑的旧任务。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release + 上传资产

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  release:
    name: build & publish (${{ github.ref_name }})
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2w-windows
          key: release

      # ---------------------------------------------------------------
      # 发布前最低验证：lib 单测（单线程，规避已知 wgpu 偶发崩溃）。
      # 集成测试需要真实模型/样片，在 CI 上不可能通过，故不在此跑。
      # ---------------------------------------------------------------
      - name: cargo test --lib
        run: cargo test --lib -- --test-threads=1

      - name: cargo build --release
        # release 会让 gpui 的 build script 去找 fxc.exe 编译着色器；
        # windows-latest 自带 Windows SDK，where.exe 能命中（仓库不写死路径）。
        run: cargo build --release

      # ---------------------------------------------------------------
      # 创建 Release 并发布纯净便携版 voice2word.exe
      # ---------------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Voice2Word ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: target/release/voice2word.exe
          body: |
            ## Voice2Word ${{ github.ref_name }} (Windows x64)

            纯净便携单文件版，直接下载 `voice2word.exe` 即可运行（绿色免安装）。

            ### 使用说明
            1. 下载下方 `voice2word.exe` 双击即可运行。
            2. 首次运行若缺少本地语音或标点模型，进入「性能设置 → 模型与组件」一键补齐即可。