# =============================================================================
# Voice2Word — Release (打 tag 自动构建并发布)
# =============================================================================
# 用法：本地打一个 semver tag 并推送即可，例如
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# 触发后本工作流会：
#   1. 在 windows-latest 上构建 release（产物为绿色便携版 exe 与 CLI 工具）
#   2. 跑一次 lib 单测做最低限度的发布前验证
#   3. 使用 Inno Setup 编译生成标准 Windows 安装向导安装包
#   4. 创建 GitHub Release 并发布安装包与便携版（tag 带 - 的视为预发布）
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release + 上传资产

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  release:
    name: build & publish (${{ github.ref_name }})
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $paths = @("C:\Program Files\Inno Setup 6", "C:\Program Files (x86)\Inno Setup 6")
          foreach ($p in $paths) {
            if (Test-Path $p) {
              $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2w-windows
          key: release

      - name: Verify Tag against Cargo.toml
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $tagVersion = $tag -replace '^v', ''
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Tag Version: $tagVersion, Cargo.toml Version: $cargoVersion"
          if ($tagVersion -ne $cargoVersion) {
            throw "版本号不匹配！Git Tag 为 $tagVersion，但 Cargo.toml 为 $cargoVersion。请统一版本号后再打 Tag 发布！"
          }

      # ---------------------------------------------------------------
      # 发布前最低验证：lib 单测（单线程，规避已知 wgpu 偶发崩溃）。
      # ---------------------------------------------------------------
      - name: cargo test --lib
        run: cargo test --lib -- --test-threads=1

      - name: cargo build --release (voice2word)
        run: cargo build --release --bin voice2word

      # 便携版里的无头入口：脚本/CI 用它（控制台子系统，shell 会同步等待，
      # 重定向与退出码可靠）。单独构建，避免与上面两步的 `--bin` 语义混淆。
      - name: cargo build --release (voice2word-cli)
        run: cargo build --release --bin voice2word-cli

      # 内置便携 Python（SenseVoice / CT-Punc 的运行环境）。
      # 网络异常不阻断发布：安装包脚本对该目录是 skipifsourcedoesntexist，
      # 缺了也能装，只是客户机需要自备完整 Python。
      - name: Build bundled Python runtime
        shell: pwsh
        continue-on-error: true
        run: pwsh -File scripts/build_python_runtime.ps1

      # -----------------------------------------------------------------------
      # 预取推理后端二进制（llama.cpp / whisper.cpp）及其**同目录 DLL**。
      #
      # 为什么这一步不能省：llama.cpp 的 `llama-completion.exe` 只有 ~9 KB（真正的
      # 代码在 `llama-common.dll` / `llama-server-impl.dll` / `ggml-*.dll` 里），
      # whisper.cpp 同理。安装包若只发 exe 不发 DLL，客户机上这两个程序会立刻以
      # 0xC0000139（STATUS_ENTRYPOINT_NOT_FOUND）退出，**且没有任何 stderr**——
      # 用户只看到「点了没反应」，日志里也没有线索。
      #
      # 开发机上 DLL 就在仓库的 tools/ 下（本机跑过），所以本地永远正常；
      # 打包时漏掉就是「本机好使、别人电脑不好使」的经典成因。
      #
      # 这里的目录结构必须与 config.toml 的默认路径一致：
      #   tools/llama-completion.exe + tools/*.dll
      #   tools/whisper-vulkan/whisper-1.8.4-windows-x64/whisper-cli.exe + 同目录 DLL
      # -----------------------------------------------------------------------
      - name: Prefetch inference backends (llama.cpp / whisper.cpp)
        shell: pwsh
        # **不吞错误**：预取失败意味着安装包缺 DLL（客户机上进程以 0xC0000139
        # 秒退且无任何 stderr）——那正是「本机好使、别人电脑不好使」的成因。
        # 宁可让这次发布失败，也不要发出一个必然在客户机上失败的包。
        # 脚本自身会对单个源做多镜像回退，只有全都不行才失败。
        run: pwsh -File scripts/prefetch_inference_backends.ps1

      # -----------------------------------------------------------------------
      # 用**代码里的默认值**重新生成随包 config.toml。
      #
      # 仓库里的 config.toml 是被 git 跟踪的**开发机配置**：whisper_model 指向
      # SenseVoice 的 onnx、线程数按 16 核调过。原样打进安装包，客户机就会拿到
      # 「引擎选 Whisper、模型是 ONNX」——whisper-cli 读不了，**退出码 0 且不写 JSON**，
      # 上层只能报「未产出任何识别结果」（CHANGELOG 0.2.19 记录过的客户机故障）。
      #
      # 由二进制自己吐默认值，既不会漂移、也不可能带上开发机的绝对路径或密钥。
      # -----------------------------------------------------------------------
      - name: Emit clean default config.toml
        shell: pwsh
        run: |
          $out = & target/release/voice2word-cli.exe --print-default-config
          if ($LASTEXITCODE -ne 0) { throw "生成默认配置失败（exit=$LASTEXITCODE）" }
          $text = ($out -join "`n")
          if ($text -notmatch '(?m)^whisper_model\s*=\s*"models/whisper/') {
            throw '生成的 config.toml 里 whisper_model 未指向 Whisper 的 ggml 模型——拒绝打包。'
          }
          if ($text -match '(?m)^\s*api_key\s*=\s*"[^"]+"') {
            throw '生成的 config.toml 里出现了 api_key——拒绝打包。'
          }
          Set-Content -Path config.toml -Value $out -Encoding UTF8
          Write-Host '已生成干净的默认 config.toml'

      # ---------------------------------------------------------------
      # 组装发布物并调用 Inno Setup 编译标准安装包
      # ---------------------------------------------------------------
      - name: Build Installer and Assemble Release Assets
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          if (-not (Test-Path target/release/voice2word.exe)) { throw "缺少 target/release/voice2word.exe" }
          if (-not (Test-Path target/release/voice2word-cli.exe)) { throw "缺少 target/release/voice2word-cli.exe" }

          Copy-Item target/release/voice2word.exe dist/voice2word.exe -Force
          Copy-Item target/release/voice2word-cli.exe dist/voice2word-cli.exe -Force

          # FFmpeg 三件套由上一步的预取脚本负责（含 av*/sw* DLL）。
          # 这里只做**存在性断言**，不再自己下载——两处各自下载过同名文件时，
          # 打包结果会取决于谁先跑，正是「本机好使、别人电脑不好使」的成因。
          foreach ($need in @('tools/ffmpeg.exe', 'tools/ffplay.exe', 'tools/ffprobe.exe')) {
            if (-not (Test-Path $need)) {
              throw "缺 $need：预取步骤应当已经准备好它。若刚改过预取源，请检查上一步日志。"
            }
          }
          # 编译安装包之前先自检：确认「会打进包的东西」真的能用。
          # 失败即中止发布——发出一个必然在客户机上失败的包没有意义。
          Write-Host "Running package self-check..." -ForegroundColor Cyan
          pwsh -File scripts/verify_package.ps1
          if ($LASTEXITCODE -ne 0) { throw "打包自检未通过（exit=$LASTEXITCODE），中止发布" }

          Write-Host "Locating and Compiling Inno Setup Script..." -ForegroundColor Cyan
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "未在系统或 Chocolatey 路径中找到 ISCC.exe (Inno Setup 编译器)" }
          Write-Host "Using ISCC compiler at: $iscc" -ForegroundColor Green
          & $iscc /DMyAppVersion="$version" installer/voice2word.iss

          $setupExe = "dist/Voice2Word-v$version-Setup.exe"
          if (-not (Test-Path $setupExe)) {
            throw "Inno Setup 编译完成但未找到产物：$setupExe"
          }
          Write-Host "Release Assets prepared successfully:" -ForegroundColor Green
          Get-ChildItem dist

      # ---------------------------------------------------------------
      # 创建 GitHub Release 并发布安装包与便携版
      # ---------------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Voice2Word ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/Voice2Word-*-Setup.exe
            dist/voice2word.exe
            dist/voice2word-cli.exe
          body: |
            ### 📦 发行文件说明
            • Voice2Word-${{ github.ref_name }}-Setup.exe：标准向导安装包（推荐），支持自定义安装目录与创建桌面快捷方式
            • voice2word.exe：绿色便携版，单文件直接运行（免安装）
            • voice2word-cli.exe：后台命令行无头程序，供脚本与自动化批处理调用

            ### 💡 首次使用提示
            1. 推荐下载并运行 Voice2Word-Setup 安装向导完成安装；
            2. 首次运行若缺少本地语音识别或标点模型，进入「性能设置 → 模型与组件」一键补齐即可。
