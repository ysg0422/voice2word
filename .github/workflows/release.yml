# =============================================================================
# Voice2Word — Release (打 tag 自动构建并发布)
# =============================================================================
# 用法：本地打一个 semver tag 并推送即可，例如
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# 触发后本工作流会：
#   1. 在 windows-latest 上构建 release（产物为绿色便携版 exe）
#   2. 跑一次 lib 单测做最低限度的发布前验证
#   3. 创建 GitHub Release 并直接发布 voice2word.exe（tag 带 - 的视为预发布）
#
# 关于权限：创建 Release 需要 contents: write（本文件显式声明）。
# 若推送 tag 时被拒并提示 workflow scope，说明所用 PAT 缺少 workflow 权限。
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

# 同一 tag 重复推送时取消在跑的旧任务。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release + 上传资产

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  release:
    name: build & publish (${{ github.ref_name }})
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2w-windows
          key: release

      # ---------------------------------------------------------------
      # 发布前最低验证：lib 单测（单线程，规避已知 wgpu 偶发崩溃）。
      # 集成测试需要真实模型/样片，在 CI 上不可能通过，故不在此跑。
      # ---------------------------------------------------------------
      - name: cargo test --lib
        run: cargo test --lib -- --test-threads=1

      - name: cargo build --release
        # 一次性构建主程序 voice2word.exe 与内置向导安装包 voice2word-setup.exe
        run: cargo build --release

      # ---------------------------------------------------------------
      # 组装发布物（安装包向导版 + 绿色便携版）
      # ---------------------------------------------------------------
      - name: Assemble Release Assets
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/voice2word.exe dist/voice2word.exe -Force
          Copy-Item target/release/voice2word-setup.exe "dist/Voice2Word-v$version-Setup.exe" -Force
          Get-ChildItem dist

      # ---------------------------------------------------------------
      # 创建 GitHub Release 并发布安装包与便携版
      # ---------------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Voice2Word ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/Voice2Word-*-Setup.exe
            dist/voice2word.exe
          body: |
            ## Voice2Word ${{ github.ref_name }} (Windows x64)

            ### 下载说明
            | 文件 | 类型 | 适用场景与说明 |
            | :--- | :--- | :--- |
            | **`Voice2Word-v${{ github.ref_name }}-Setup.exe`** | **安装包向导版（推荐）** | 自动向导安装，自动生成桌面快捷方式、开始菜单图标与卸载项，无控制台黑框 |
            | `voice2word.exe` | 绿色便携版 | 单文件即开即用（无控制台黑框），免安装 |

            ### 首次使用
            1. 下载安装包或便携版直接运行即可。
            2. 首次运行若缺少本地语音或标点模型，进入「性能设置 → 模型与组件」一键补齐即可。