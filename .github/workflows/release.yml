# =============================================================================
# Voice2Word — Release (打 tag 自动构建并发布)
# =============================================================================
# 用法：本地打一个 semver tag 并推送即可，例如
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# 触发后本工作流会：
#   1. 在 windows-latest 上构建 release（产物为绿色便携版 exe 与 CLI 工具）
#   2. 跑一次 lib 单测做最低限度的发布前验证
#   3. 使用 Inno Setup 编译生成标准 Windows 安装向导安装包
#   4. 创建 GitHub Release 并发布安装包与便携版（tag 带 - 的视为预发布）
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release + 上传资产

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  release:
    name: build & publish (${{ github.ref_name }})
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2w-windows
          key: release

      - name: Verify Tag against Cargo.toml
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $tagVersion = $tag -replace '^v', ''
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Tag Version: $tagVersion, Cargo.toml Version: $cargoVersion"
          if ($tagVersion -ne $cargoVersion) {
            throw "版本号不匹配！Git Tag 为 $tagVersion，但 Cargo.toml 为 $cargoVersion。请统一版本号后再打 Tag 发布！"
          }

      # ---------------------------------------------------------------
      # 发布前最低验证：lib 单测（单线程，规避已知 wgpu 偶发崩溃）。
      # ---------------------------------------------------------------
      - name: cargo test --lib
        run: cargo test --lib -- --test-threads=1

      - name: cargo build --release (voice2word)
        run: cargo build --release --bin voice2word

      # 便携版里的无头入口：脚本/CI 用它（控制台子系统，shell 会同步等待，
      # 重定向与退出码可靠）。单独构建，避免与上面两步的 `--bin` 语义混淆。
      - name: cargo build --release (voice2word-cli)
        run: cargo build --release --bin voice2word-cli

      # ---------------------------------------------------------------
      # 组装发布物并调用 Inno Setup 编译标准安装包
      # ---------------------------------------------------------------
      - name: Build Installer and Assemble Release Assets
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          if (-not (Test-Path target/release/voice2word.exe)) { throw "缺少 target/release/voice2word.exe" }
          if (-not (Test-Path target/release/voice2word-cli.exe)) { throw "缺少 target/release/voice2word-cli.exe" }

          Copy-Item target/release/voice2word.exe dist/voice2word.exe -Force
          Copy-Item target/release/voice2word-cli.exe dist/voice2word-cli.exe -Force

          # 确保 tools 目录存在并预先抓取 ffmpeg.exe 与 ffplay.exe 打包入安装包
          New-Item -ItemType Directory -Path tools -Force | Out-Null
          if (-not (Test-Path tools/ffmpeg.exe)) {
            Write-Host "Downloading ffmpeg.exe for installer..." -ForegroundColor Cyan
            Invoke-WebRequest -Uri "https://hf-mirror.com/lj1995/VoiceConversionWebUI/resolve/main/ffmpeg.exe" -OutFile tools/ffmpeg.exe -TimeoutSec 60
          }
          if (-not (Test-Path tools/ffplay.exe)) {
            Write-Host "Downloading ffplay.exe for installer..." -ForegroundColor Cyan
            Invoke-WebRequest -Uri "https://hf-mirror.com/lj1995/VoiceConversionWebUI/resolve/main/ffplay.exe" -OutFile tools/ffplay.exe -TimeoutSec 60
          }

          Write-Host "Compiling Inno Setup Script..." -ForegroundColor Cyan
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" installer/voice2word.iss

          $setupExe = "dist/Voice2Word-v$version-Setup.exe"
          if (-not (Test-Path $setupExe)) {
            throw "Inno Setup 编译完成但未找到产物：$setupExe"
          }
          Write-Host "Release Assets prepared successfully:" -ForegroundColor Green
          Get-ChildItem dist

      # ---------------------------------------------------------------
      # 创建 GitHub Release 并发布安装包与便携版
      # ---------------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Voice2Word ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/Voice2Word-*-Setup.exe
            dist/voice2word.exe
            dist/voice2word-cli.exe
          body: |
            ## Voice2Word ${{ github.ref_name }} (Windows x64)

            ### 下载说明
            | 文件 | 类型 | 适用场景与说明 |
            | :--- | :--- | :--- |
            | **`Voice2Word-${{ github.ref_name }}-Setup.exe`** | **向导安装包（推荐）** | 标准 Windows 安装向导，可自选安装目录；自动创建开始菜单、桌面图标与卸载程序，无控制台黑框 |
            | `voice2word.exe` | 绿色便携版 | 单文件即开即用（无控制台黑框），免安装 |
            | `voice2word-cli.exe` | 无头 / 脚本入口 | 控制台子系统程序，供自动化脚本、批处理调用，退出码与流重定向可靠 |

            ### 首次使用
            1. 下载安装包或便携版直接运行即可。
            2. 首次运行若缺少本地语音或标点模型，进入「性能设置 → 模型与组件」一键补齐即可。
